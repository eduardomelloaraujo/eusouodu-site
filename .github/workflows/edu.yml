name: reel-edu
on:
  push:
    branches: [midia-reel]
    paths: [reel/edu.m4a, reel/palavras_edu.py]
permissions:
  contents: write
jobs:
  tempos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests faster-whisper==1.0.3 2>&1 | tail -2
      - run: python reel/palavras_edu.py
      - run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -f reel/palavras_edu.json && git commit -m "[audio] tempos da narração do Eduardo" && git push
