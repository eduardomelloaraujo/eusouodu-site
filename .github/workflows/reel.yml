name: reel-audio
on:
  push:
    branches: [midia-reel]
permissions:
  contents: write
jobs:
  audio:
    if: "!contains(github.event.head_commit.message, '[audio]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL "$(cat reel/url.txt)" -o reel/narracao.mp3 && ls -la reel
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install faster-whisper==1.0.3 2>&1 | tail -3
      - run: python reel/palavras.py 2>&1 | tail -20 | tee reel/whisper.log
        continue-on-error: true
      - run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -f reel/ && git commit -m "[audio] narração e tempos" && git push
